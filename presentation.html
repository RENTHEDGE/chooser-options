<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chooser Option - Presentación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #003366;
            --secondary: #f8f9fa;
            --accent-call: #2ecc71;
            --accent-put: #e74c3c;
            --timer: #e67e22;
            --text-dark: #333333;
            --text-light: #ffffff;
            --border: #ddd;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: var(--primary);
            color: var(--text-dark);
            overflow: hidden;
        }

        .presentation-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slides-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--secondary);
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 1;
        }

        .slide.active {
            opacity: 1;
            z-index: 10;
        }

        /* Header con timer */
        .slide::before {
            content: '';
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 80px;
            height: 80px;
            background: var(--secondary);
            z-index: 20;
        }

        /* Timer SVG */
        .timer-container {
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 80px;
            height: 80px;
            z-index: 25;
        }

        /* Navigation */
        .nav-button {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            background: rgba(0, 51, 102, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 50;
            transition: background 0.3s;
        }

        .nav-button:hover {
            background: rgba(0, 51, 102, 0.9);
        }

        .nav-button.prev {
            left: 2rem;
        }

        .nav-button.next {
            right: 2rem;
        }

        /* Slide counter */
        .slide-counter {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            font-size: 18px;
            color: var(--text-dark);
            background: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 40;
        }

        /* Javeriana logo */
        #univ-logo {
            position: fixed;
            bottom: 1.4rem;
            left: 1.5rem;
            z-index: 30;
            display: flex;
            align-items: center;
        }

        #univ-logo img {
            height: 72px;
            width: auto;
            display: block;
            opacity: 0.95;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,.7))
                    drop-shadow(0 0 8px rgba(0,0,0,.5));
            transition: opacity 0.2s;
        }

        #univ-logo img:hover {
            opacity: 1;
        }

        /* Content styles */
        .slide-content {
            text-align: center;
            max-width: 90%;
        }

        h1 {
            font-size: 3.5rem;
            color: var(--primary);
            margin-bottom: 2rem;
            line-height: 1.2;
        }

        h2 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 2rem;
        }

        h3 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            color: var(--text-dark);
        }

        .subtitle {
            font-size: 1.4rem;
            color: #666;
            font-style: italic;
        }

        .button-group {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-call {
            background: var(--accent-call);
            color: white;
        }

        .btn-call:hover {
            background: #27ae60;
            transform: scale(1.05);
        }

        .btn-put {
            background: var(--accent-put);
            color: white;
        }

        .btn-put:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        .btn-back {
            background: var(--primary);
            color: white;
            margin-top: 1rem;
        }

        .btn-back:hover {
            background: #001f3f;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            h1 { font-size: 2.5rem; }
            h2 { font-size: 2rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="presentation-container">
        <div class="slides-wrapper" id="slidesWrapper">
            <!-- Las diapositivas se agregarán aquí -->
        </div>

        <!-- Navigation -->
        <button class="nav-button prev" onclick="previousSlide()">❮</button>
        <button class="nav-button next" onclick="nextSlide()">❯</button>

        <!-- Slide counter -->
        <div class="slide-counter">
            <span id="currentSlide">1</span> / <span id="totalSlides">1</span>
        </div>

        <!-- Timer -->
        <div class="timer-container" id="timerContainer"></div>

        <!-- Javeriana Logo -->
        <div id="univ-logo">
            <img src="img/Javeriana.png" alt="Pontificia Universidad Javeriana Cali"
                 onerror="this.parentNode.style.display='none'">
        </div>
    </div>

    <script>
        let currentSlideIndex = 0;
        let slides = [];

        // Array de configuración de slides
        const slidesConfig = [
            {
                html: `
                    <div class="slide-content">
                        <h1>La opción que compra tiempo</h1>
                        <p class="subtitle">Chooser Option</p>
                        <div style="margin-top: 4rem; font-size: 1.1rem; color: #666;">
                            <p><strong>Presentado por</strong></p>
                            <p>Juan Felipe Barriga Beltrán</p>
                            <p>Ana Sofía Rojas Valderrama</p>
                        </div>
                        <div style="margin-top: 5rem; font-size: 4rem; opacity: 0.3;">
                            ⏳
                        </div>
                    </div>
                `
            }
        ];

        function renderSlides() {
            const wrapper = document.getElementById('slidesWrapper');
            wrapper.innerHTML = '';

            slidesConfig.forEach((slideConfig, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide';
                slideDiv.innerHTML = slideConfig.html;
                if (index === 0) slideDiv.classList.add('active');
                wrapper.appendChild(slideDiv);
            });

            slides = document.querySelectorAll('.slide');
            document.getElementById('totalSlides').textContent = slides.length;
            updateTimer();
        }

        function showSlide(index) {
            if (index < 0) index = slides.length - 1;
            if (index >= slides.length) index = 0;

            slides.forEach(slide => slide.classList.remove('active'));
            slides[index].classList.add('active');
            currentSlideIndex = index;

            document.getElementById('currentSlide').textContent = index + 1;
            updateTimer();

            // Ejecutar callback si existe
            if (slidesConfig[index].onShow) {
                slidesConfig[index].onShow();
            }
        }

        function nextSlide() {
            showSlide(currentSlideIndex + 1);
        }

        function previousSlide() {
            showSlide(currentSlideIndex - 1);
        }

        function updateTimer() {
            const timerContainer = document.getElementById('timerContainer');
            const totalSlides = slides.length;
            const progress = (currentSlideIndex + 1) / totalSlides;

            // Calcular color según progreso
            let fillColor = '#2ecc71'; // verde inicial
            if (progress > 0.5) fillColor = '#f39c12'; // naranja medio
            if (progress > 0.8) fillColor = '#e74c3c'; // rojo final

            const svg = `
                <svg width="80" height="80" viewBox="0 0 80 80">
                    <!-- Círculo background -->
                    <circle cx="40" cy="40" r="35" fill="none" stroke="#e0e0e0" stroke-width="2"/>

                    <!-- Círculo progress -->
                    <circle cx="40" cy="40" r="35" fill="none" stroke="${fillColor}"
                            stroke-width="3" stroke-dasharray="${220 * progress} 220"
                            stroke-linecap="round" transform="rotate(-90 40 40)"
                            style="transition: stroke 0.3s, stroke-dasharray 0.3s;"/>

                    <!-- Icono reloj -->
                    <text x="40" y="48" font-size="24" text-anchor="middle" fill="${fillColor}"
                          font-weight="bold" style="transition: fill 0.3s;">🕐</text>
                </svg>
            `;

            timerContainer.innerHTML = svg;
        }

        // Controles de teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') previousSlide();
        });

        // Inicializar presentación cuando está lista
        window.addEventListener('DOMContentLoaded', () => {
            renderSlides();
        });
    </script>
</body>
</html>
